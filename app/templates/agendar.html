<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Slotly</title>
</head>
<body>
    <form method="get" action="/agendar/horarios">
        <select name="servico_id">
            {% for servico in servicos %}
                <option value="{{ servico.id }}">{{ servico.nome }} - R$ {{ servico.preco }}</option>
            {% endfor %}
        </select>
        <label>Data:</label>
        <input type="date" name="data">

        <button type="submit">Ver horários</button>

    </form>
</body>
</html>

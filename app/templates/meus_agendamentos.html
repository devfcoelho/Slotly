<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus agendamentos</title>
</head>
<body>
    <h1>Agendamentos</h1>
    <ul>
        {%for agendamento in agendamentos%}
        <li>
            Serviço: {{agendamento.servico.nome}}
            Data e hora: {{ agendamento.data_hora_inicio.strftime('%d/%m/%Y %H:%M') }}
            {% if agendamento.status == "CONFIRMADO" %}
           <form method="post" action="/meus_agendamentos/{{agendamento.id_agendamento}}/cancelar">
                <button type="submit">Cancelar</button>
            </form>
            {% else %}
                ({{agendamento.status}})
            {% endif %}
        </li>
        {% endfor %}
    </ul>
</body>
</html>

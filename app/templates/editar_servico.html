{% extends "base.html" %}

{% block conteudo %}
    <form method="post">
        <label>Nome do serviço:</label>
        <input type="text" name="nome" value="{{servico.nome}}">

        <label>Duração (min):</label>
        <input type="number" name="duracao_min" value="{{servico.duracao_min}}">

        <label>Preço:</label>
        <input type="number" name="preco" value="{{servico.preco}}">

        <button type="submit">Salvar</button>
    </form>
{% endblock %}

{% extends "base.html" %}

{% block conteudo %}
    <h1>Bloqueios</h1>
    <ul>
        {% for bloqueio in bloqueios %}
            <li>
                {{ bloqueio.data_hora_inicio }} até {{ bloqueio.data_hora_fim }}
                {% if bloqueio.motivo %}
                    - {{ bloqueio.motivo }}
                {% endif %}
                <a href="/bloqueios/{{ bloqueio.id }}/editar">Editar</a>
                <form method="post" action="/bloqueios/{{ bloqueio.id }}/remover" style="display: inline;">
                    <button type="submit">Remover</button>
                </form>
            </li>
        {% endfor %}
    </ul>
{% endblock %}

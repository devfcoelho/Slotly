<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horários</title>
</head>
<body>
    <h1>Horários</h1>
    <ul>
        {% for horario in horarios %}
            <li>Dia {{ horario.dia_semana }}: {{ horario.hora_inicio }} às {{ horario.hora_fim }}</li>
        {% endfor %}
    </ul>
</body>
</html>

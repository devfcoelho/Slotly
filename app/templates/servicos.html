<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Serviços - Slotly</title>
</head>
<body>
    <h1>Serviços</h1>
    <ul>
        {% for servico in servicos %}
            <li>{{ servico.nome }} - {{ servico.duracao_min }} min - R$ {{ servico.preco }}<a href="/servicos/{{servico.id}}/editar">Editar</a></li>
        {% endfor %}
    </ul>
</body>
</html>
